name: Frontend Workflow

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Terraform Workflow
    types:
      - completed
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "frontend/**"

permissions:
  contents: read
  id-token: write

jobs:
  check-and-build:
    name: frontend
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    defaults:
      run:
        working-directory: frontend/

    steps:
      
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run astro check
        run: bun run astro check

      - name: Run astro build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          PUBLIC_API_URL: ${{ secrets.API_URL }}
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 2


  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: check-and-build
    environment: production

    defaults:
      run:
        working-directory: 'frontend/'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        id: init
        working-directory: terraform/
        run: terraform init -input=false

      - name: Get Bucket name and Distribution ID
        id: s3cf
        working-directory: terraform/
        run: |
          echo "frontend_bucket=$(terraform output -raw frontend_bucket)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: frontend-build
          path: frontend/dist/

      - name: Sync to S3
        run: |
          aws s3 sync \
            dist/_astro \
            s3://${{ steps.s3cf.outputs.frontend_bucket }}/_astro \
            --cache-control "public, immutable, max-age=31536000"

          aws s3 sync \
            dist \
            s3://${{ steps.s3cf.outputs.frontend_bucket }} \
            --delete \
            --exclude "_astro/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.s3cf.outputs.distribution_id }} \
            --paths "/*"
